server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: cloud-backup-recovery-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cloud_backup_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

# Application-specific configurations
app:
  jwt:
    # 256-bit base64/hex secret for HMAC-SHA256 signing
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 86400000 # 24 hours in milliseconds
  storage:
    type: s3 # s3 or minio
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET:cloud-backups}
    region: ${MINIO_REGION:us-east-1}
  user:
    default-quota-bytes: 10737418240 # 10 GB initial quota per user

logging:
  level:
    root: INFO
    com.cloudbackup: DEBUG
    org.springframework.security: INFO


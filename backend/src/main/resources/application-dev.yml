server:
  port: 8080

spring:
  application:
    name: cloud-backup-recovery-system-dev

  datasource:
    url: jdbc:h2:mem:cloudbackup;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 86400000
  storage:
    type: local
    local-directory: ./data/cloud-storage
  user:
    default-quota-bytes: 10737418240

logging:
  level:
    root: INFO
    com.cloudbackup: INFO

